<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="close()">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Manage Categories</ion-title>
  </ion-toolbar>
  
  <ion-toolbar>
    <ion-searchbar
      placeholder="Add a new category..."
      [(ngModel)]="newCategoryName"
      (keyup.enter)="addCategory()"
      [showCancelButton]="'focus'"
      animated>
      <div slot="end" class="category-actions">
        <ion-button fill="clear" (click)="showIconPicker()">
          <ion-icon [name]="newCategoryIcon"></ion-icon>
        </ion-button>
        <ion-button fill="clear" class="color-preview" [style.--background]="newCategoryColor">
          <ion-icon name="color-palette" (click)="showColorPicker($event)"></ion-icon>
        </ion-button>
        <ion-button fill="clear" (click)="addCategory()" [disabled]="!newCategoryName.trim()">
          <ion-icon slot="icon-only" name="add"></ion-icon>
        </ion-button>
      </div>
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item-sliding *ngFor="let category of categories$ | async">
      <ion-item>
        <ion-icon 
          [name]="category.icon" 
          slot="start" 
          [style.color]="category.color"
          class="category-icon">
        </ion-icon>
        <ion-label>
          <h2>{{ category.name }}</h2>
          <p>Created {{ category.createdAt | date:'mediumDate' }}</p>
        </ion-label>
        
        <ion-button fill="clear" (click)="editCategory(category)">
          <ion-icon slot="icon-only" name="create-outline"></ion-icon>
        </ion-button>
      </ion-item>
      
      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="deleteCategory(category)">
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="close()">
      <ion-icon name="checkmark"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>

<ion-popover #colorPicker>
  <ng-template>
    <ion-content class="ion-padding">
      <ion-grid>
        <ion-row>
          <ion-col size="4" *ngFor="let color of colorPalette">
            <div 
              class="color-option" 
              [style.background]="color"
              (click)="selectColor(color)">
            </div>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-content>
  </ng-template>
</ion-popover>

<ion-popover #iconPicker>
  <ng-template>
    <ion-content class="ion-padding">
      <ion-grid>
        <ion-row>
          <ion-col size="3" *ngFor="let icon of availableIcons">
            <ion-button 
              fill="clear" 
              (click)="selectIcon(icon)"
              [color]="icon === newCategoryIcon ? 'primary' : 'medium'">
              <ion-icon [name]="icon"></ion-icon>
            </ion-button>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-content>
  </ng-template>
</ion-popover>
