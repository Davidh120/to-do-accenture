<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="close()">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Manage Categories</ion-title>
  </ion-toolbar>
  
  <ion-toolbar>
    <div class="add-category-container">
      <ion-item lines="none" class="add-category-item">
        <ion-input
          placeholder="Add a new category..."
          [(ngModel)]="newCategoryName"
          (keyup.enter)="addCategory()"
          clearInput>
        </ion-input>
        <div class="category-actions">
          <ion-button fill="clear" (click)="showIconPicker($event)" size="small">
            <ion-icon [name]="newCategoryIcon"></ion-icon>
          </ion-button>
          <ion-button fill="clear" class="color-preview" [style.--background]="newCategoryColor" (click)="showColorPicker($event)" size="small">
            <ion-icon name="color-palette" slot="icon-only"></ion-icon>
          </ion-button>
          <ion-button fill="clear" (click)="addCategory()" [disabled]="!newCategoryName.trim()" size="small">
            <ion-icon slot="icon-only" name="add"></ion-icon>
          </ion-button>
        </div>
      </ion-item>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
    <p>Loading categories...</p>
  </div>

  <!-- Categories List -->
  <ion-list *ngIf="!isLoading">
    <ion-item-sliding *ngFor="let category of categories$ | async">
      <ion-item>
        <ion-icon 
          [name]="category.icon" 
          slot="start" 
          [style.color]="category.color"
          class="category-icon">
        </ion-icon>
        <ion-label>
          <h2>{{ category.name }}</h2>
          <p>Created {{ category.createdAt | date:'mediumDate' }}</p>
        </ion-label>
        
        <ion-buttons slot="end">
          <ion-button fill="clear" (click)="editCategory(category)">
            <ion-icon slot="icon-only" name="create-outline"></ion-icon>
          </ion-button>
          <ion-button fill="clear" color="danger" (click)="deleteCategory(category)">
            <ion-icon slot="icon-only" name="trash"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-item>
    </ion-item-sliding>
  </ion-list>

</ion-content>

<ion-popover [isOpen]="showColorPickerFlag" (didDismiss)="showColorPickerFlag = false">
  <ng-template>
    <ion-content class="ion-padding">
      <ion-grid>
        <ion-row>
          <ion-col size="4" *ngFor="let color of colorPalette">
            <div 
              class="color-option" 
              [class.selected]="color === newCategoryColor"
              [style.background]="color"
              [style.border-color]="color === newCategoryColor ? 'var(--ion-color-dark)' : 'transparent'"
              (click)="selectColor(color); showColorPickerFlag = false">
            </div>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-content>
  </ng-template>
</ion-popover>

<ion-popover #iconPicker>
  <ng-template>
    <ion-content class="ion-padding">
      <ion-grid>
        <ion-row>
          <ion-col size="3" *ngFor="let icon of availableIcons">
            <ion-button 
              fill="clear" 
              (click)="selectIcon(icon)"
              [color]="icon === newCategoryIcon ? 'primary' : 'medium'">
              <ion-icon [name]="icon"></ion-icon>
            </ion-button>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-content>
  </ng-template>
</ion-popover>
